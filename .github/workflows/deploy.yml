name: Deploy to Cloud Run and Firebase

on:
  push:
    branches:
      - main    # Production
      - dev     # Development

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/renovationtech-backend:${{ github.sha }} .
          docker tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/renovationtech-backend:${{ github.sha }} gcr.io/${{ secrets.GCP_PROJECT_ID }}/renovationtech-backend:latest

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/renovationtech-backend:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/renovationtech-backend:latest

      - name: Run database migrations
        working-directory: ./backend
        run: |
          # Install uv if needed
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Run migrations based on branch
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            export DATABASE_URL="${{ secrets.DATABASE_URL_PROD }}"
          else
            export DATABASE_URL="${{ secrets.DATABASE_URL_DEV }}"
          fi
          
          uv run alembic upgrade head

      - name: Deploy to Cloud Run
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            SERVICE_NAME="renovationtech-backend-prod"
            DATABASE_URL="${{ secrets.DATABASE_URL_PROD }}"
            GCS_BUCKET="${{ secrets.GCS_BUCKET_PROD }}"
          else
            SERVICE_NAME="renovationtech-backend-dev"
            DATABASE_URL="${{ secrets.DATABASE_URL_DEV }}"
            GCS_BUCKET="${{ secrets.GCS_BUCKET_DEV }}"
          fi
          
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/renovationtech-backend:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --service-account usebowerbird-backend@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars DATABASE_URL="$DATABASE_URL" \
            --set-env-vars GCS_BUCKET_NAME="$GCS_BUCKET" \
            --set-env-vars LLM_API_KEY="${{ secrets.LLM_API_KEY }}" \
            --set-env-vars LLM_PROVIDER="${{ secrets.LLM_PROVIDER }}" \
            --set-env-vars LLM_MODEL="${{ secrets.LLM_MODEL }}" \
            --set-env-vars VLM_API_KEY="${{ secrets.VLM_API_KEY }}" \
            --set-env-vars VLM_PROVIDER="${{ secrets.VLM_PROVIDER }}" \
            --set-env-vars VLM_MODEL="${{ secrets.VLM_MODEL }}" \
            --set-env-vars STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
            --set-env-vars RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --set-env-vars EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10

  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.VITE_API_BASE_URL_PROD || secrets.VITE_API_BASE_URL_DEV }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || 'dev' }}
